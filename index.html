<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="tictactoe.css">
    </head>
    <body>
        
        <div class="score-panel">
            <div class="player" id="playerX">
              <h3>Player X: <span id="scoreX">0</span></h3>
            </div>
            <div class="player" id="playerO">
              <h3>Player O: <span id="scoreO">0</span></h3>
            </div>
          </div>
          
          <!-- Your tic-tac-toe board -->
          <div class="board">
            <!-- 3x3 grid cells here -->
          </div>
        
        <div class="gridcontainer">
            <div class="grid">
                <div class="box" id="a"><h1 id="ha"></h1></div>
                <div class="box" id="b"><h1 id="hb"></h1></div>
        <div class="box" id="c"><h1 id="hc"></h1></div>
        <div class="box" id="d"><h1 id="hd"></h1></div>
        <div class="box" id="e"><h1 id="he"></h1></div>
        <div class="box" id="f"><h1 id="hf"></h1></div>
        <div class="box" id="g"><h1 id="hg"></h1></div>
        <div class="box" id="h"><h1 id="hh"></h1></div>
        <div class="box" id="i"><h1 id="hi"></h1></div>
    </div>
    <div class="buttons">
        <button id="start"> start </button>
        <button id="reset">reset</button>
    </div>
</div>


<script src="tictactoe.js"></script>
</body>
</html>
